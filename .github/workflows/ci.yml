name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go mod verify
      - run: go vet ./...
      # The released core must not depend on where it is built: build every release target the
      # way the release does (no cgo, -trimpath, empty build ID) from two directories and require
      # identical bytes. docs/VERIFYING-RELEASES.md tells users how to repeat this.
      - name: release core is repeatable
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for d in "$RUNNER_TEMP/a" "$RUNNER_TEMP/elsewhere/b"; do
            mkdir -p "$d/src"
            git -C .. archive HEAD | tar -x -C "$d/src"
            for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64; do
              (cd "$d/src/core" && CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -ldflags=-buildid= -o "$d/kydrive-sync-${t/\//-}" ./cmd/kydrive-sync)
              go version -m "$d/kydrive-sync-${t/\//-}" | grep -Eq 'DefaultGODEBUG=([^,]*,)*fips140=on(,|$)'
            done
          done
          sha256sum "$RUNNER_TEMP"/a/kydrive-sync-* "$RUNNER_TEMP"/elsewhere/b/kydrive-sync-*
          for f in "$RUNNER_TEMP"/a/kydrive-sync-*; do cmp "$f" "$RUNNER_TEMP/elsewhere/b/${f##*/}"; done
      - name: Test
        shell: bash
        # The race detector needs cgo, which the Windows runner lacks by default.
        run: if [ "$RUNNER_OS" = Windows ]; then go test ./...; else go test -race ./...; fi
      # Known vulnerabilities in the toolchain and dependencies the core links. The Go
      # version comes from core/go.mod, so a stale go line fails here, not after a release.
      - name: govulncheck
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  real-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned public KyDrive server source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Busnes-app/kydrive-server
          ref: a949b9ac016090a604d2ecc2bd9631f921fffad4
          path: .ci/kydrive-server
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .ci/kydrive-server/go.mod
          cache-dependency-path: |
            .ci/kydrive-server/go.sum
            core/go.sum
      - name: Build the pinned server
        working-directory: .ci/kydrive-server
        run: go build -o "$RUNNER_TEMP/kydrive-server" ./cmd/server
      - name: Full engine suite against the real server
        working-directory: core
        env:
          KYDRIVE_SERVER_BIN: ${{ runner.temp }}/kydrive-server
        run: go test -race -count=1 -timeout=10m ./engine/
      - name: Install private-keyring smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus-daemon gnome-keyring libsecret-tools
      - name: Build the real daemon
        working-directory: core
        run: go build -o "$RUNNER_TEMP/kydrive-sync" ./cmd/kydrive-sync
      - name: Real daemon, keyring, watcher and revocation
        env:
          TMPDIR: ${{ runner.temp }}
        run: timeout 120 bash scripts/smoke.sh "$RUNNER_TEMP/kydrive-server" "$RUNNER_TEMP/kydrive-sync"

  linux-shell:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add KDE neon apt archive (KF6/Qt6 for noble)
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://archive.neon.kde.org/public.key | sudo gpg --dearmor -o /etc/apt/keyrings/neon-archive.gpg
          echo "deb [signed-by=/etc/apt/keyrings/neon-archive.gpg] https://archive.neon.kde.org/user noble main" \
            | sudo tee /etc/apt/sources.list.d/neon.list
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gettext \
            qt6-base-dev qt6-declarative-dev libkf6kirigami2-dev libkf6i18n-dev \
            libkf6dbusaddons-dev kf6-kstatusnotifieritem-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-org-kde-kirigami
      - run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install flatpak-builder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils appstream desktop-file-utils
      - name: Validate metadata
        run: |
          appstreamcli validate --no-net linux/packaging/com.kysecurity.drive.metainfo.xml
          desktop-file-validate linux/packaging/com.kysecurity.drive.desktop
      - name: Install runtime and SDK
        run: |
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.kde.Platform//6.11 org.kde.Sdk//6.11 org.freedesktop.Sdk.Extension.golang//25.08
      - name: Build
        run: flatpak-builder --user --force-clean --disable-rofiles-fuse --repo=repo build-flatpak linux/packaging/flatpak/com.kysecurity.drive.yml
      - name: Both binaries are in the bundle
        run: test -x build-flatpak/files/bin/kydrive-sync && test -x build-flatpak/files/bin/kydrive-desktop
      # A single-file bundle; installing it pulls the KDE runtime from Flathub.
      - name: Bundle
        run: flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo KyDrive-linux.flatpak com.kysecurity.drive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kydrive-linux-flatpak
          path: KyDrive-linux.flatpak
          if-no-files-found: error

  macos-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Build the core
        working-directory: core
        run: go build -o "$RUNNER_TEMP/kydrive-sync" ./cmd/kydrive-sync
      - name: Unit tests
        working-directory: macos
        run: KYDRIVE_SYNC_BIN="$RUNNER_TEMP/kydrive-sync" swift test
      - name: Bundle
        run: macos/scripts/bundle.sh
      - name: Check the bundle
        run: |
          app=macos/build/KyDrive.app
          agent=$app/Contents/Library/LaunchAgents/com.kysecurity.drive.sync.plist
          plutil -lint "$app/Contents/Info.plist" "$agent"
          test -x "$app/$(plutil -extract BundleProgram raw "$agent")"
          lipo "$app/Contents/MacOS/KyDrive" -verify_arch arm64 x86_64
          lipo "$app/Contents/MacOS/kydrive-sync" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(plutil -extract CFBundleIconFile raw "$app/Contents/Info.plist")" = AppIcon
          iconutil -c iconset -o "$RUNNER_TEMP/round.iconset" "$app/Contents/Resources/AppIcon.icns"
          n=$(find "$RUNNER_TEMP/round.iconset" -type f | wc -l); echo "AppIcon.icns holds $n images"; test "$n" -eq 10
      - name: Launch the app and reach its core
        run: |
          open macos/build/KyDrive.app
          sock="$HOME/Library/Application Support/kydrive/sync.sock"
          for _ in $(seq 60); do [ -S "$sock" ] && break; sleep 1; done
          echo "launch agent:"
          launchctl print "gui/$(id -u)/com.kysecurity.drive.sync" 2>&1 | grep -E '^[[:space:]]*(state|pid|program|last exit code) =' || echo "not loaded"
          echo "running cores (ppid 1 = launchd):"
          # shellcheck disable=SC2009 # Include the parent PID to diagnose launchd ownership.
          ps -axo pid,ppid,comm | grep '[k]ydrive-sync' || true
          macos/build/KyDrive.app/Contents/MacOS/kydrive-sync ctl Status
      - name: Zip the unsigned app
        run: ditto -c -k --keepParent macos/build/KyDrive.app KyDrive-macos-unsigned.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KyDrive-macos-unsigned
          path: KyDrive-macos-unsigned.zip
          if-no-files-found: error

  # Developer ID signing and notarization: pushes to main and tags only, never pull requests,
  # and only once the secrets in macos/AGENTS.md exist.
  # Decided on Linux so an unsigned repo never holds a macOS runner for macos-sign.
  signing:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          HAVE_SIGNING: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' }}
        run: |
          echo "configured=$HAVE_SIGNING" >> "$GITHUB_OUTPUT"
          if [ "$HAVE_SIGNING" != true ]; then
            echo "::notice::Apple signing secrets are not set; skipping macos-sign. See macos/AGENTS.md."
          fi

  macos-sign:
    needs: [macos-shell, signing]
    if: needs.signing.outputs.configured == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Bundle
        run: macos/scripts/bundle.sh
      - name: Import the Developer ID certificate
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          kc=$RUNNER_TEMP/signing.keychain-db
          kcpass=$(uuidgen)
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc"
          security list-keychains -d user -s "$kc"
      - name: Sign
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app=macos/build/KyDrive.app
          for target in "$app/Contents/MacOS/kydrive-sync" "$app"; do
            codesign --force --options runtime --timestamp --keychain "$RUNNER_TEMP/signing.keychain-db" \
              --sign "Developer ID Application" "$target"
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -qx "TeamIdentifier=$TEAM_ID"
      - name: Notarize
        env:
          KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          app=macos/build/KyDrive.app
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose "$app"
          ditto -c -k --keepParent "$app" KyDrive-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KyDrive-macos
          path: KyDrive-macos.zip
          if-no-files-found: error
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  windows-shell:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build the core for x64 and arm64
        shell: bash
        working-directory: core
        # No cgo (the core needs none) and an empty build ID, so the same commit gives the same
        # core on any machine, as the `core` job checks.
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags=-buildid= -o ../windows/build/core/x64/kydrive-sync.exe ./cmd/kydrive-sync
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags=-buildid= -o ../windows/build/core/ARM64/kydrive-sync.exe ./cmd/kydrive-sync
      - name: Unit, IPC and real-core tests
        env:
          KYDRIVE_SYNC_EXE: ${{ github.workspace }}\windows\build\core\x64\kydrive-sync.exe
        run: dotnet test KyDrive.Tests --logger "console;verbosity=normal"
      # Evidence for the socket's access control: the core in the runner's real %LOCALAPPDATA%,
      # its directory ACL, and another local user trying to call it.
      - name: Socket ACL and another user
        run: |
          $exe = Resolve-Path build\core\x64\kydrive-sync.exe
          $sock = Join-Path $env:LOCALAPPDATA 'kydrive\sync.sock'
          $core = Start-Process $exe -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 50 -and -not (Test-Path $sock); $i++) { Start-Sleep -Milliseconds 200 }
          & $exe ctl Status
          if ($LASTEXITCODE) { throw 'the owner cannot call the core' }
          icacls (Split-Path $sock)
          icacls $sock
          $me = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          $ids = (Get-Acl (Split-Path $sock)).Access | ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique
          "directory ACL identities: $($ids -join ', ')"
          $broad = $ids | Where-Object { $_ -notin @($me, 'NT AUTHORITY\SYSTEM', 'BUILTIN\Administrators') }
          $plain = 'Kd!' + [guid]::NewGuid().ToString('N').Substring(0, 8) + 'a1' # net user prompts above 14 characters
          net user kydother $plain /add
          if ($LASTEXITCODE) { throw "could not create the test user" }
          $cred = [pscredential]::new('kydother', (ConvertTo-SecureString $plain -AsPlainText -Force))
          $out = 'C:\Users\Public\kyd-other.txt'
          $cmd = "`$env:LOCALAPPDATA = '$env:LOCALAPPDATA'; & '$exe' ctl Status *> '$out'; exit `$LASTEXITCODE"
          $p = Start-Process pwsh -Credential $cred -LoadUserProfile -Wait -PassThru -ArgumentList '-NoProfile', '-Command', $cmd
          "kydother exit $($p.ExitCode):"
          Get-Content $out
          Stop-Process $core
          net user kydother /delete | Out-Null
          if ($broad) { throw "the socket directory grants $broad" }
          if ($p.ExitCode -eq 0 -or -not (Select-String -Quiet 'not running' $out)) { throw 'another user reached the socket, or the check did not run' }
      # Unsigned: there is no Windows certificate yet (windows/AGENTS.md).
      - name: Build the app, MSIX and zip for x64 and arm64
        run: |
          foreach ($p in 'x64', 'ARM64') {
            dotnet build KyDrive -c Release -p:Platform=$p -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Never -p:AppxPackageDir="$pwd\out\msix\"
            if ($LASTEXITCODE) { exit 1 }
            dotnet publish KyDrive -c Release -p:Platform=$p -p:WindowsPackageType=None -o "out\KyDrive-$p"
            if ($LASTEXITCODE) { exit 1 }
            Compress-Archive -Path "out\KyDrive-$p\*" -DestinationPath "out\KyDrive-windows-$($p.ToLower()).zip"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($m in Get-ChildItem -Recurse out\msix -Filter *.msix) {
            $names = [IO.Compression.ZipFile]::OpenRead($m.FullName).Entries.FullName
            "$($m.Name): $($names.Count) files"
            foreach ($f in 'KyDrive.exe', 'kydrive-sync.exe', 'AppxManifest.xml', 'Assets/logo44.targetsize-32_altform-unplated.png') { if ($f -notin $names) { throw "$($m.Name) lacks $f" } }
          }
          foreach ($p in 'x64', 'ARM64') { foreach ($f in 'KyDrive.exe', 'kydrive-sync.exe') { if (-not (Test-Path "out\KyDrive-$p\$f")) { throw "zip $p lacks $f" } } }
      # Each build on the runner's desktop must start its bundled core on the contract socket path
      # and render the link form, which needs the core's answer (screenshots are artifacts).
      - name: Launch the zip build
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'smoke\Local'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          .\launch-check.ps1 -Target out\KyDrive-x64\KyDrive.exe -Socket (Join-Path $env:LOCALAPPDATA 'kydrive\sync.sock') -Shot "$pwd\out\screenshot-zip.png"
          Get-Process KyDrive, kydrive-sync | Stop-Process -Force
      - name: Install and launch the MSIX
        run: |
          Remove-Item -Recurse -Force (Join-Path $env:LOCALAPPDATA kydrive) -ErrorAction SilentlyContinue
          $msix = Get-ChildItem -Recurse out\msix -Filter *_x64.msix | Select-Object -First 1
          Add-AppxPackage -Path $msix.FullName -AllowUnsigned
          $pkg = Get-AppxPackage com.kysecurity.drive
          $pkg | Format-List Name, PackageFamilyName, InstallLocation, SignatureKind
          $sock = Join-Path $env:LOCALAPPDATA 'kydrive\sync.sock'
          .\launch-check.ps1 -Target "shell:AppsFolder\$($pkg.PackageFamilyName)!App" -Socket $sock -Shot "$pwd\out\screenshot-msix.png"
          # The packaged core is reachable from outside the package on the same path.
          & build\core\x64\kydrive-sync.exe ctl Status
          $ok = $LASTEXITCODE -eq 0
          Get-Process KyDrive, kydrive-sync | Stop-Process -Force
          Remove-AppxPackage $pkg.PackageFullName
          if (-not $ok) { throw 'ctl could not reach the packaged core' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kydrive-windows-msix-unsigned
          path: windows/out/msix/**/*.msix
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kydrive-windows-zip
          path: windows/out/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-launch-screenshot
          path: windows/out/screenshot*.png

  # A v* tag publishes every package to a GitHub Release, once all jobs pass. The tag must
  # match the version in the CMake project, metainfo, Info.plist and MSIX manifest.
  release:
    needs: [core, real-server, linux-shell, flatpak, macos-shell, macos-sign, windows-shell]
    # macos-sign is skipped, not failed, when signing is not configured.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # Two runs for one tag would race on `gh release create`; a half-finished publish is never cancelled.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write     # create the release
      id-token: write     # keyless attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the packaged version
        run: |
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::tag '$GITHUB_REF_NAME' is not vX.Y.Z or vX.Y.Z-suffix"; exit 1; }
          ver=${GITHUB_REF_NAME#v}; ver=${ver%%-*}
          cmake=$(sed -n 's/^project(.* VERSION \([0-9.]*\) .*/\1/p' linux/CMakeLists.txt)
          meta=$(grep -o -m1 '<release version="[^"]*"' linux/packaging/com.kysecurity.drive.metainfo.xml | cut -d'"' -f2)
          plist=$(grep -A1 CFBundleShortVersionString macos/packaging/Info.plist | sed -n 's|.*<string>\(.*\)</string>.*|\1|p')
          msix=$(grep -o '<Identity [^>]* Version="[^"]*"' windows/KyDrive/Package.appxmanifest | sed 's/.*Version="\([^"]*\)"/\1/')
          echo "tag $ver, CMake $cmake, metainfo $meta, Info.plist $plist, MSIX $msix"
          test "$cmake" = "$ver" && test "$meta" = "$ver" && test "$plist" = "$ver" && test "$msix" = "$ver.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      # Asset names carry no version, so .../releases/latest/download/<name> stays a stable link.
      - name: Collect the packages and their checksums
        run: |
          mac=$(find dist -name KyDrive-macos.zip); [ -n "$mac" ] || mac=$(find dist -name KyDrive-macos-unsigned.zip)
          mapfile -t files < <(find dist -name 'KyDrive-windows-*.zip' -o -name '*.msix' -o -name KyDrive-linux.flatpak)
          files+=("$mac")
          printf '%s\n' "${files[@]}"
          test ${#files[@]} -eq 6 # macOS, two zips, two MSIX, Flatpak
          mkdir release && cp "${files[@]}" release/
          cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      # Keyless and verifiable with `gh attestation verify`; SHA256SUMS is attested too.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      # A pre-release is a test build: its notes, prepended to the generated ones, say so and give
      # install steps for the unsigned packages.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=(); [[ $GITHUB_REF_NAME == *-* ]] && pre=(--prerelease --notes-file .github/release-notes/prerelease.md)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "KyDrive desktop $GITHUB_REF_NAME" \
            --generate-notes "${pre[@]}" release/*
