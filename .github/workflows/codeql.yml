name: CodeQL

# Replaces code scanning's default setup, which cannot build the native shells.
# Default setup must be off for these uploads to land.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

# Each non-PR run gets its own group: a ref-keyed group drops queued main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # The native shells need a build per OS runner, so not per pull request: main, weekly and by
  # hand. Builds follow ci.yml's, unsigned and one architecture: the source is arch-neutral.
  shells:
    name: Analyze (${{ matrix.language }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: macos-latest
          - language: csharp
            runner: windows-latest
          - language: c-cpp
            runner: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # KyDrive.csproj bundles the core and refuses to build without it.
      - if: matrix.language == 'csharp'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - if: matrix.language == 'csharp'
        name: Build the core
        shell: bash
        working-directory: core
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o ../windows/build/core/x64/kydrive-sync.exe ./cmd/kydrive-sync

      - if: matrix.language == 'c-cpp'
        name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gettext \
            qt6-base-dev qt6-declarative-dev libkirigami-dev libkf6i18n-dev \
            libkf6dbusaddons-dev libkf6statusnotifieritem-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-org-kde-kirigami
      - if: matrix.language == 'c-cpp'
        name: Configure
        run: cmake -B build -S linux -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: manual

      - if: matrix.language == 'swift'
        name: Build the macOS shell
        working-directory: macos
        run: swift build -c release --arch arm64
      - if: matrix.language == 'csharp'
        name: Build the Windows shell
        working-directory: windows
        run: dotnet build KyDrive -c Release -p:Platform=x64
      - if: matrix.language == 'c-cpp'
        name: Build the Linux shell
        run: cmake --build build

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
